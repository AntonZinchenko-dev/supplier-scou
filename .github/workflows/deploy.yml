name: Проверка и публикация

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Зависимости
        run: npm install --no-audit --no-fund

      - name: Проверка типов
        run: npm run typecheck

      - name: Модульные тесты (логика и демо-каталог)
        run: npm test

      - name: Сборка
        run: npm run build

      - name: Браузер для сквозной проверки
        run: npx playwright install --with-deps chromium

      - name: Сквозная проверка (390, 1280 и 1440 px)
        run: npm run e2e

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
